name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test ${{ matrix.os }} Julia ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        # os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
        julia-version: ['1.10']
        # julia-version: ['1.10', '1.11', '1.12']

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Install Julia dependencies (without precompile)
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build C++ wrapper
        run: |
          cd deps/src
          cmake -S . -B build
          cmake --build build

      - name: Stage libkafka for precompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib
          libpath="$(find deps/src/build -type f -name "libkafka.*" | head -n 1)"
          if [ -z "$libpath" ]; then
            echo "ERROR: libkafka not found under deps/src/build"
            find deps/src/build -type f -name "libkafka.*" -print
            exit 1
          fi
          cp "$libpath" lib/

      - name: Precompile all packages
        run: julia --project=. -e 'using Pkg; Pkg.precompile()'

      - name: Verify build artifacts
        run: |
          ls -lh deps/src/build/lib/
          file deps/src/build/lib/libkafka.*

      # TODO: Add Julia tests when test/runtests.jl is created
      # - name: Run tests
      #   run: julia --project=. -e 'using Pkg; Pkg.test()'
